services:
  - type: web
    name: webyotic-landing
    runtime: php
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "php artisan serve --host=0.0.0.0 --port=${PORT:-10000}"
    envVars:
      - key: APP_NAME
        value: Webyotic
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://webyotic-landing.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
